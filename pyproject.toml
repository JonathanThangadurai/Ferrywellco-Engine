[project]
name = "gotime-data"
version = "0.1.0"
description = "GOTime data layer: weather and air quality forecasts and observations, stored as one hourly table."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
]

# Added in stage B/C when the code needs them (kept out of stage A on purpose):
# ecmwf-opendata, cdsapi, httpx, xarray, cfgrib, eccodes, h5netcdf, pyarrow, duckdb, fsspec, s3fs

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
