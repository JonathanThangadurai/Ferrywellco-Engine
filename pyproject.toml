[project]
name = "gotime-data"
version = "0.1.0"
description = "GOTime data layer: weather and air quality forecasts and observations, stored as one hourly table."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cdsapi>=0.7.7",
    "cfgrib>=0.9.15.1",
    "duckdb>=2.0.0",
    "eccodes>=2.50.1",
    "eccodeslib>=2.50.0.34",
    "ecmwf-opendata>=0.3.35",
    "fsspec>=2026.9.0",
    "h5netcdf>=1.8.3",
    "h5py>=3.16.0",
    "httpx>=0.28.1",
    "netcdf4>=1.7.5.1.post1",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0",
    "xarray>=2026.9.0",
]

# eccodeslib ships the ecCodes C library as a wheel, so no system install is needed.
# s3fs is added when storage moves to s3://.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gotime_data"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
